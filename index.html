<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Recepção · Centro Médico AMAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:        #10B3A0;
    --amber:       #E8AC3B;
    --vivo:        #E8544A;
    --vidro:       rgba(10,16,18,.42);
    --vidro-forte: rgba(8,12,14,.62);
    --borda-vidro: rgba(255,255,255,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100vw; height:100vh; overflow:hidden;
    font-family:'Outfit', sans-serif; background:#05070a;
  }

  /* ── PALCO: onde o conteúdo do banco de dados passa, 100vw x 100vh ── */
  #palco { position:fixed; inset:0; width:100vw; height:100vh; background:#05070a; }
  .camada-midia {
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; transition:opacity .9s ease;
  }
  .camada-midia.ativa { opacity:1; z-index:2; }
  .midia-full { position:absolute; inset:0; width:100%; height:100%; background:#000; }
  .midia-full img, .midia-full video {
    width:100%; height:100%; object-fit:cover; display:block;
  }
  /* leve escurecida nas bordas pra logo/relógio/ticker sempre legíveis, em qualquer imagem */
  .midia-full::after {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 16%, transparent 82%, rgba(0,0,0,.6) 100%);
  }

  /* ── Slide "comunicado" (aviso institucional), também full bleed ── */
  .comunicado-bg {
    position:absolute; inset:0; width:100%; height:100%;
    background:
      radial-gradient(circle at 18% 20%, rgba(16,179,160,.35), transparent 55%),
      radial-gradient(circle at 85% 82%, rgba(232,172,59,.28), transparent 50%),
      linear-gradient(160deg, #0B1615 0%, #0E1E1C 55%, #0A1412 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .comunicado-card {
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius:28px;
    padding:64px 90px; max-width:80%;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,.6);
    display:flex; align-items:center; gap:52px;
  }
  .comunicado-icone {
    position:relative; flex-shrink:0;
    width:120px; height:120px; border-radius:50%;
    background: linear-gradient(160deg, rgba(16,179,160,.28), rgba(232,172,59,.18));
    display:flex; align-items:center; justify-content:center;
    color:var(--teal);
  }
  .comunicado-icone svg { width:56px; height:56px; position:relative; z-index:2; }
  .comunicado-icone .anel-pulso {
    position:absolute; inset:-8px; border-radius:50%;
    border:2px solid var(--teal); opacity:.55;
    animation: pulso-anel 2.2s ease-out infinite;
  }
  @keyframes pulso-anel {
    0%   { transform:scale(.85); opacity:.6; }
    100% { transform:scale(1.4);  opacity:0;  }
  }
  .comunicado-corpo { text-align:left; }
  .comunicado-eyebrow {
    display:flex; align-items:center; gap:9px;
    font-size:.85em; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--amber); margin-bottom:14px;
  }
  .comunicado-eyebrow .ponto-vivo-com {
    width:7px; height:7px; border-radius:50%; background:var(--vivo);
    animation:pulso 1.4s infinite;
  }
  .comunicado-card .titulo {
    font-family:'Cormorant Garamond', serif; font-size:3.2em; font-weight:600;
    color:#fff; margin-bottom:16px; letter-spacing:.2px; line-height:1.1;
  }
  .comunicado-card .desc { font-size:1.28em; color:rgba(255,255,255,.78); line-height:1.45; }
  .comunicado-audio {
    display:flex; align-items:center; gap:10px; margin-top:24px;
    font-size:.8em; color:rgba(255,255,255,.5); letter-spacing:.04em;
    visibility:hidden;
  }
  .comunicado-audio .barra {
    width:3px; height:12px; background:var(--teal); border-radius:2px;
    animation: onda-audio 1s ease-in-out infinite;
  }
  .comunicado-audio .barra:nth-child(2){ animation-delay:.15s; }
  .comunicado-audio .barra:nth-child(3){ animation-delay:.3s; }
  .comunicado-audio .barra:nth-child(4){ animation-delay:.45s; }
  @keyframes onda-audio { 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }

  /* ── Estado ocioso (sem conteúdo cadastrado) ── */
  .estado-ocioso {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; text-align:center;
    background:
      radial-gradient(circle at 22% 24%, rgba(16,179,160,.25), transparent 55%),
      radial-gradient(circle at 80% 78%, rgba(232,172,59,.2), transparent 55%),
      linear-gradient(160deg, #0A1210 0%, #0D1917 55%, #090F0E 100%);
  }
  .estado-ocioso .logo-grande { height:74px; filter: drop-shadow(0 2px 14px rgba(0,0,0,.5)); }
  .estado-ocioso .logo-grande.erro { display:none; }
  .estado-ocioso .marca-texto {
    display:none; font-family:'Cormorant Garamond', serif; font-size:3em;
    color:#fff; font-weight:600;
  }
  .estado-ocioso .logo-grande.erro + .marca-texto { display:block; }
  .estado-ocioso .marca-texto em { font-style:italic; color:var(--teal); }
  .estado-ocioso .tagline { font-size:1.15em; color:rgba(255,255,255,.55); letter-spacing:.04em; }

  /* ── BARRA SUPERIOR: logo (esq.) + relógio/tempo (dir.), estilo emissora ── */
  .selo {
    position:fixed; top:26px; z-index:30;
    display:flex; align-items:center; gap:12px;
    background: var(--vidro); backdrop-filter: blur(14px);
    border:1px solid var(--borda-vidro); border-radius:100px;
    box-shadow: 0 14px 34px -16px rgba(0,0,0,.5);
    color:#fff;
  }

  /* Logo solta, sem círculo/moldura — só um drop-shadow pra garantir
     leitura sobre qualquer imagem/vídeo de fundo. */
  .selo-solta {
    position:fixed; top:26px; left:30px; z-index:30;
    display:flex; align-items:center;
  }
  .selo-solta img {
    height:48px; display:block;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(0,0,0,.35));
  }
  .selo-solta img.erro { display:none; }
  .selo-solta .txt {
    display:none; align-items:center; gap:9px;
    font-family:'Cormorant Garamond', serif; font-size:1.7em; font-weight:600; color:#fff;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.55));
  }
  .selo-solta img.erro + .txt { display:flex; }
  .selo-solta .ponto-marca { width:8px; height:8px; border-radius:50%; background:var(--amber); }
  .selo-solta em { font-style:italic; color:var(--teal); }

  #selo-info { right:30px; padding:10px 26px; gap:20px; }
  .info-relogio { text-align:right; line-height:1.1; }
  .info-relogio .hora {
    font-size:1.55em; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em;
  }
  .info-relogio .data { font-size:.72em; color:rgba(255,255,255,.6); text-transform:capitalize; letter-spacing:.02em; }
  .info-divisor { width:1px; height:32px; background:rgba(255,255,255,.2); }
  .info-tempo { display:flex; align-items:center; gap:10px; transition: opacity .25s ease; }
  .info-tempo .ic { width:34px; height:34px; flex-shrink:0; }
  .info-tempo .ic svg { width:100%; height:100%; overflow:visible; }
  .info-tempo .txt-tempo { line-height:1.15; }
  .info-tempo .graus { font-size:1.2em; font-weight:700; }
  .info-tempo .cidade { font-size:.68em; color:rgba(255,255,255,.6); }

  /* ── TICKER DE NOTÍCIAS: faixa única, contínua, sem rótulo ── */
  #barra-ticker {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    height:90px; display:flex; align-items:center;
    background: var(--vidro-forte); backdrop-filter: blur(14px);
    border-top:1px solid var(--borda-vidro);
  }
  @keyframes pulso { 0%,100%{opacity:1} 50%{opacity:.25} }
  #ticker-viewport { flex:1 1 auto; height:100%; overflow:hidden; position:relative; }
  #ticker-trilho {
    position:absolute; top:0; left:0; height:100%; display:flex; align-items:center;
    white-space:nowrap; will-change:transform;
    animation: rolar linear infinite;
  }
  #ticker-trilho .item {
    display:inline-flex; align-items:center; gap:16px;
    padding:0 3em; flex-shrink:0;
  }
  #ticker-trilho .item img {
    width:120px; height:80px; border-radius:9px; object-fit:cover; flex-shrink:0;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  #ticker-trilho .item b {
    color:#fff; font-size:1.02em; font-weight:500; opacity:.94; white-space:nowrap;
  }
  #ticker-trilho .sep { color:var(--amber); font-size:1.1em; flex-shrink:0; }
  @keyframes rolar { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  .estado-vazio { color:rgba(255,255,255,.55); font-size:1.1em; }

  /* ── BLOQUEIO PARA TELAS PEQUENAS ──────────────────────────────────
     Este painel foi feito pra rodar em TVs (ou no máximo em um
     computador). Em celulares e tablets, em vez de mostrar o layout
     quebrado, exibimos um aviso pedindo um dispositivo maior. */
  #bloqueio-tela-pequena {
    display:none; /* só vira flex quando a media query abaixo bate */
    position:fixed; inset:0; z-index:9999;
    flex-direction:column; align-items:center; justify-content:center;
    gap:22px; text-align:center; padding:40px;
    background:
      radial-gradient(circle at 22% 24%, rgba(16,179,160,.25), transparent 55%),
      radial-gradient(circle at 80% 78%, rgba(232,172,59,.2), transparent 55%),
      linear-gradient(160deg, #0A1210 0%, #0D1917 55%, #090F0E 100%);
  }
  #bloqueio-tela-pequena .icone-tela {
    width:84px; height:84px; color:var(--teal);
  }
  #bloqueio-tela-pequena .icone-tela svg { width:100%; height:100%; }
  #bloqueio-tela-pequena .titulo-bloqueio {
    font-family:'Cormorant Garamond', serif; font-size:2em; font-weight:600;
    color:#fff; max-width:520px; line-height:1.2;
  }
  #bloqueio-tela-pequena .desc-bloqueio {
    font-size:1.05em; color:rgba(255,255,255,.65); max-width:440px; line-height:1.5;
  }

  /* Considera "tela pequena" celulares e tablets: largura curta OU
     ponteiro grosso (toque) sem hover — TVs e PCs não caem aqui. */
  @media (max-width:900px), (pointer:coarse) and (max-width:1180px) {
    #bloqueio-tela-pequena { display:flex; }
    #palco, #selo-marca, #selo-info, #barra-ticker { display:none !important; }
  }
</style>
</head>
<body>

  <!-- Bloqueio: exibido apenas em celulares/tablets (ver media query no <style>) -->
  <div id="bloqueio-tela-pequena">
    <div class="icone-tela">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="10" y="22" width="80" height="52" rx="6"/>
        <path d="M38 86h24"/>
        <path d="M50 74v12"/>
        <path d="M28 44l14 14 8-8 12 12"/>
      </svg>
    </div>
    <div class="titulo-bloqueio">Visualização não disponível neste dispositivo</div>
    <div class="desc-bloqueio">Este painel foi feito para TVs e computadores. Tente acessar por um dispositivo com tela maior.</div>
  </div>

  <!-- PALCO: conteúdo cadastrado no banco de dados, sempre 100vw x 100vh -->
  <div id="palco">
    <div id="palco-a" class="camada-midia ativa"></div>
    <div id="palco-b" class="camada-midia"></div>
  </div>

  <!-- Logo: solta, sem moldura/círculo -->
  <div id="selo-marca" class="selo-solta">
    <img src="logo-amar.png" onerror="this.classList.add('erro')">
    <div class="txt"><span class="ponto-marca"></span>Centro <em>Médico</em> AMAR</div>
  </div>

  <!-- Selo da emissora: relógio + tempo (sutil, sempre visível) -->
  <div id="selo-info" class="selo">
    <div class="info-tempo" id="info-tempo"></div>
    <div class="info-divisor"></div>
    <div class="info-relogio">
      <div class="hora" id="relogio"></div>
      <div class="data" id="data-hoje"></div>
    </div>
  </div>

  <!-- Ticker de notícias: faixa única, contínua, no rodapé -->
  <div id="barra-ticker">
    <div id="ticker-viewport">
      <div id="ticker-trilho"><span class="item"><b>Carregando notícias…</b></span></div>
    </div>
  </div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const API = 'https://tv-amar.andrewmssantos.workers.dev';

// Cidades exibidas em rodízio no chip de tempo, no canto superior direito.
// (Nenhuma preferência específica foi passada — usei Feira de Santana +
// Salvador + duas cidades próximas como sugestão; é só trocar aqui.)
const CIDADES = [
  { nome:'Feira de Santana',        lat:-12.2667, lon:-38.9667 },
  { nome:'Salvador',                lat:-12.9714, lon:-38.5014 },
  { nome:'Alagoinhas',              lat:-12.1358, lon:-38.4192 },
  { nome:'Santo Antônio de Jesus',  lat:-12.9528, lon:-39.2808 },
];

const FONTES_NOTICIAS = [
  'https://www.acordacidade.com.br/feed/',
  'https://news.google.com/rss/search?q=Feira%20de%20Santana&hl=pt-BR&gl=BR&ceid=BR:pt-419',
];
const QTD_NOTICIAS_TICKER = 12;

const DURACAO_PADRAO = {
  imagem:     10 * 1000,
  comunicado: 14 * 1000,     // tempo de leitura do aviso na tela
  video_max:  3 * 60 * 1000, // rede de segurança se o vídeo travar
  // Obs.: a narração por voz do comunicado (o indicador "narrando
  // comunicado" no HTML) ainda não está implementada — é só visual
  // por enquanto. Se quiser, posso adicionar de verdade depois.
};

const INTERVALO_RECHECAGEM_VAZIO   = 20 * 1000;        // quando não há nada cadastrado
const INTERVALO_ATUALIZA_TEMPO     = 2  * 60 * 1000;   // busca nova temperatura das cidades
const INTERVALO_ROTACAO_CIDADE     = 6  * 1000;        // troca a cidade exibida no chip
const INTERVALO_ATUALIZA_TICKER    = 2  * 60 * 1000;   // busca notícias novas no feed

let slidesEmpresa = [];
let idxSlide = 0;
let camadaAtual = 'a';
let timerAtual = null;

function agendar(ms, fn) {
  if (timerAtual) clearTimeout(timerAtual);
  timerAtual = setTimeout(fn, ms);
}

// ── RELÓGIO ───────────────────────────────────────────────────────
function atualizarRelogio() {
  const agora = new Date();
  document.getElementById('relogio').textContent =
    agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('data-hoje').textContent =
    agora.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}
setInterval(atualizarRelogio, 1000 * 15);
atualizarRelogio();

// ── CONTEÚDO DA EMPRESA (banco de dados) ───────────────────────────
async function carregarSlidesEmpresa() {
  try {
    const r = await fetch(`${API}/tv_propaganda`);
    const todos = await r.json();
    const hoje = new Date().toISOString().slice(0, 10);
    return todos.filter(it => {
      if (it.data_inicio && it.data_inicio > hoje) return false;
      if (it.data_final && it.data_final < hoje) return false;
      return true;
    });
  } catch (e) {
    return [];
  }
}

function construirMidiaHTML(it) {
  if (it.tipo === 'video') {
    return `<div class="midia-full"><video src="${it.url}" autoplay playsinline></video></div>`;
  }
  if (it.tipo === 'comunicado') {
    return `<div class="comunicado-bg"><div class="comunicado-card">
      <div class="comunicado-icone">
        <div class="anel-pulso"></div>
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M50 12c-4 0-7 3-7 7v3c-11 3-19 13-19 25v18l-8 10h68l-8-10V47c0-12-8-22-19-25v-3c0-4-3-7-7-7z"/>
          <path d="M40 82a10 10 0 0 0 20 0"/>
        </svg>
      </div>
      <div class="comunicado-corpo">
        <div class="comunicado-eyebrow"><span class="ponto-vivo-com"></span>Aviso Oficial</div>
        <div class="titulo">${it.nome || ''}</div>
        <div class="desc">${it.descricao || ''}</div>
        <div class="comunicado-audio" id="comunicado-audio-indicador">
          <span class="barra"></span><span class="barra"></span><span class="barra"></span><span class="barra"></span>
          narrando comunicado
        </div>
      </div>
    </div></div>`;
  }
  return `<div class="midia-full"><img src="${it.url}" alt=""></div>`;
}

function mostrarProximaCamada(html) {
  const proxima = camadaAtual === 'a' ? 'b' : 'a';
  const elAtual = document.getElementById('palco-' + camadaAtual);
  const elProxima = document.getElementById('palco-' + proxima);
  elProxima.innerHTML = html;
  void elProxima.offsetWidth; // força reflow pra transição funcionar
  elProxima.classList.add('ativa');
  elAtual.classList.remove('ativa');
  const antiga = elAtual;
  camadaAtual = proxima;
  setTimeout(() => { antiga.innerHTML = ''; }, 950);
  return elProxima;
}

function mostrarOcioso() {
  const html = `<div class="estado-ocioso">
      <img class="logo-grande" src="logo-amar.png" onerror="this.classList.add('erro')">
      <div class="marca-texto">Centro <em>Médico</em> AMAR</div>
      <div class="tagline">Cuidando de você com excelência</div>
    </div>`;
  mostrarProximaCamada(html);
}

async function cicloConteudo() {
  // ao voltar pro início da lista, busca de novo — assim conteúdo novo
  // cadastrado no banco entra automaticamente, sem precisar recarregar a página.
  if (idxSlide === 0) {
    slidesEmpresa = await carregarSlidesEmpresa();
  }

  if (!slidesEmpresa.length) {
    mostrarOcioso();
    agendar(INTERVALO_RECHECAGEM_VAZIO, cicloConteudo);
    return;
  }

  const it = slidesEmpresa[idxSlide];
  const elCamada = mostrarProximaCamada(construirMidiaHTML(it));

  const avancarIndice = () => {
    idxSlide = (idxSlide + 1) % slidesEmpresa.length;
    cicloConteudo();
  };

  if (it.tipo === 'video') {
    const video = elCamada.querySelector('video');
    if (video) {
      video.addEventListener('ended', avancarIndice, { once:true });
      // Tenta tocar com som; se o navegador bloquear autoplay com áudio
      // (política padrão sem interação do usuário), cai pra mudo pra
      // não travar a TV — mas registra o aviso pra facilitar o diagnóstico.
      const tentativa = video.play();
      if (tentativa && tentativa.catch) {
        tentativa.catch(() => {
          console.warn('Autoplay com som bloqueado pelo navegador — tocando mudo:', it.url);
          video.muted = true;
          video.play().catch(() => {});
        });
      }
    }
    agendar(DURACAO_PADRAO.video_max, avancarIndice);
  } else if (it.tipo === 'comunicado') {
    agendar(DURACAO_PADRAO.comunicado, avancarIndice);
  } else {
    agendar(DURACAO_PADRAO.imagem, avancarIndice);
  }
}

// ── TEMPO (chip discreto, canto superior direito) ──────────────────
const DESC_TEMPO_FAMILIA = codigo => {
  if ([0,1].includes(codigo)) return 'sol';
  if ([2,3].includes(codigo)) return 'nublado';
  if ([45,48].includes(codigo)) return 'neblina';
  if ([71,73,75,77,85,86].includes(codigo)) return 'neve';
  if ([95,96,99].includes(codigo)) return 'tempestade';
  return 'chuva';
};

function iconeTempoMiniSVG(codigo, dia) {
  const fam = DESC_TEMPO_FAMILIA(codigo);
  if (fam === 'sol') {
    if (dia) return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="24" fill="#F0B93E"/></svg>`;
    return `<svg viewBox="0 0 100 100"><path d="M62 28a24 24 0 1 0 20 30 19 19 0 0 1-20-30z" fill="#B7A8E0"/></svg>`;
  }
  if (fam === 'nublado') return `<svg viewBox="0 0 100 100">
    <ellipse cx="42" cy="58" rx="20" ry="14" fill="#D4DEE3"/><ellipse cx="58" cy="52" rx="24" ry="17" fill="#D4DEE3"/><ellipse cx="76" cy="60" rx="18" ry="13" fill="#D4DEE3"/></svg>`;
  if (fam === 'neblina') return `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="50" rx="30" ry="18" fill="#C9D4D9" opacity=".8"/></svg>`;
  if (fam === 'neve') return `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="50" rx="26" ry="16" fill="#D4DEE3"/><circle cx="40" cy="78" r="3" fill="#AFC4D2"/><circle cx="60" cy="78" r="3" fill="#AFC4D2"/></svg>`;
  if (fam === 'tempestade') return `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="46" rx="26" ry="16" fill="#9FB1BC"/><polygon points="54,58 42,80 50,80 46,96 66,72 56,72" fill="#F0B93E"/></svg>`;
  return `<svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="46" rx="26" ry="16" fill="#D4DEE3"/><rect x="38" y="70" width="4" height="12" rx="2" fill="#5AA6E0"/><rect x="58" y="70" width="4" height="12" rx="2" fill="#5AA6E0"/></svg>`;
}

let dadosTempoCidades = []; // cache: tempo atual de cada cidade da lista CIDADES
let idxCidadeExibida = 0;

async function atualizarTempoCidades() {
  try {
    dadosTempoCidades = await Promise.all(CIDADES.map(async cidade => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${cidade.lat}&longitude=${cidade.lon}` +
        `&current=temperature_2m,weather_code,is_day&timezone=America%2FSao_Paulo`;
      const r = await fetch(url);
      const d = await r.json();
      return { nome: cidade.nome, ...d.current };
    }));
  } catch (e) {
    dadosTempoCidades = [];
  }
  renderizarTempoChip();
}

function renderizarTempoChip() {
  const el = document.getElementById('info-tempo');
  if (!dadosTempoCidades.length) {
    el.innerHTML = `<div class="txt-tempo"><div class="cidade">Tempo indisponível</div></div>`;
    return;
  }
  const c = dadosTempoCidades[idxCidadeExibida % dadosTempoCidades.length];
  el.innerHTML = `
    <div class="ic">${iconeTempoMiniSVG(c.weather_code, c.is_day === 1)}</div>
    <div class="txt-tempo">
      <div class="graus">${Math.round(c.temperature_2m)}°</div>
      <div class="cidade">${c.nome}</div>
    </div>`;
}

function rotacionarCidade() {
  if (!dadosTempoCidades.length) return;
  idxCidadeExibida = (idxCidadeExibida + 1) % dadosTempoCidades.length;
  renderizarTempoChip();
}

// ── NOTÍCIAS (ticker contínuo e discreto) ──────────────────────────
const PROXIES_NOTICIAS = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
];

function extrairImagemItem(item) {
  const enclosure = item.querySelector('enclosure[url]');
  if (enclosure) return enclosure.getAttribute('url');
  const media = item.getElementsByTagName('media:content')[0] || item.getElementsByTagName('media:thumbnail')[0];
  if (media) return media.getAttribute('url') || '';
  return '';
}

async function buscarFeedComFallback() {
  for (const feedUrl of FONTES_NOTICIAS) {
    for (const montarUrl of PROXIES_NOTICIAS) {
      try {
        const r = await fetch(montarUrl(feedUrl));
        if (!r.ok) continue;
        const texto = await r.text();
        const xml = new DOMParser().parseFromString(texto, 'text/xml');
        if (xml.querySelector('parsererror')) continue;
        const items = Array.from(xml.querySelectorAll('item'));
        if (items.length) return items;
      } catch (e) { /* tenta a próxima combinação */ }
    }
  }
  return [];
}

function montarItemTicker(titulo, imagem) {
  const img = imagem
    ? `<img src="${imagem}" alt="" onerror="this.remove()">`
    : '';
  return `<span class="item">${img}<b>${titulo}</b></span><span class="sep">•</span>`;
}

async function atualizarTicker() {
  const trilho = document.getElementById('ticker-trilho');
  try {
    const items = (await buscarFeedComFallback()).slice(0, QTD_NOTICIAS_TICKER);
    if (!items.length) throw new Error('vazio');

    const noticias = items.map(it => {
      let t = it.querySelector('title')?.textContent || '';
      t = t.replace(/\s-\s[^-]+$/, '');
      return { titulo: t, imagem: extrairImagemItem(it) };
    });

    // duplica a lista pra permitir loop contínuo e sem costura no CSS —
    // cada notícia entra como um único bloco (miniatura + título) que
    // desliza pra fora enquanto a próxima já vem entrando ao lado.
    const conteudo = noticias.concat(noticias)
      .map(n => montarItemTicker(n.titulo, n.imagem))
      .join('');
    trilho.innerHTML = conteudo;

    // velocidade proporcional ao tamanho do conteúdo, pra manter leitura confortável
    const largura = trilho.scrollWidth / 2;
    const duracao = Math.max(40, largura / 55); // ~55px por segundo
    trilho.style.animationDuration = duracao + 's';
  } catch (e) {
    trilho.innerHTML = `<span class="item estado-vazio"><b>Notícias indisponíveis no momento.</b></span>`;
  }
}

// ── START ─────────────────────────────────────────────────────────
cicloConteudo();
atualizarTempoCidades();
setInterval(atualizarTempoCidades, INTERVALO_ATUALIZA_TEMPO);
setInterval(rotacionarCidade, INTERVALO_ROTACAO_CIDADE);
atualizarTicker();
setInterval(atualizarTicker, INTERVALO_ATUALIZA_TICKER);
</script>
