  <script>

      margin: 0;
      height: 100vh;
      display: flex;

      color: #333;
      text-align: center;
    }
    .box {
      padding: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e1e1e1;
      border-top-color: #E1306C;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {

    }
    a {
      color: #E1306C;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

  <script>
