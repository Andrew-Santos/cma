<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agenda · Centro Médico AMAR</title>
  <link rel="shortcut icon" href="../icon.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <header class="hdr">
    <div class="hdr-left">
      <div class="hdr-logo">
        <a href="https://www.instagram.com/teamcriativamkt/" target="_blank" rel="noopener">
          <img src="../logo-criativa.svg" alt="Criativa MKT">
        </a>
      </div>
      <div class="hdr-sep"></div>
      <span class="hdr-label">Centro Médico Amar · Agenda do Dia</span>
    </div>
    <div class="hdr-right">
      <span class="hdr-count">Selecionados: <b id="cnt-sel">0</b></span>
      <button class="btn-dl" id="btn-download">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="btn-dl-txt">Baixar Card</span>
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="workspace">

    <!-- PAINEL ESQUERDO / TOPO MOBILE -->
    <aside class="panel">
      <div class="panel-inner">

        <!-- DATA -->
        <div class="section">
          <div class="section-ttl">Data da Agenda</div>
          <div class="field">
            <label class="flabel" for="inp-data">Data de atendimento</label>
            <input type="date" class="finput" id="inp-data">
          </div>
        </div>

        <!-- SELECIONAR PROFISSIONAIS -->
        <div class="section">
          <div class="section-ttl">Profissionais</div>
          <div class="search-wrap">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-inp" id="inp-busca" placeholder="Buscar profissional..." oninput="filtrarProfs()">
          </div>
          <div id="lista-disponiveis"></div>
          <div id="secao-selecionados" style="display:none;">
            <div class="sel-header">
              <span class="sel-title">Na agenda</span>
              <span class="sel-count" id="sel-count">0</span>
            </div>
            <div id="lista-selecionados"></div>
          </div>
        </div>

      </div>
    </aside>

    <!-- PREVIEW -->
    <main class="preview-area" id="preview-area">
      <div class="preview-scroll">
        <div class="card-outer" id="card-outer">
          <div id="card-wrapper" class="card-wrapper"></div>
        </div>
      </div>
    </main>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
<!-- MODAL MOBILE DOWNLOAD -->
<div class="modal-overlay" id="modal-dl" style="display:none;">
  <div class="modal-box">
    <p class="modal-txt" id="modal-txt">Imagem gerada! Toque e segure para salvar.</p>
    <img id="modal-img" class="modal-img" src="" alt="Card gerado">
    <button class="modal-btn-fechar" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
