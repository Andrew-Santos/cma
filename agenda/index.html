<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda · Centro Médico AMAR</title>
  <link rel="shortcut icon" href="icon.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ─── TOPBAR ─── -->
  <header class="topbar">
    <div class="topbar-logo">
      <a href="https://www.instagram.com/teamcriativamkt/" target="_blank" rel="noopener">
        <img src="logo-criativa.svg" alt="Criativa">
      </a>
    </div>
    <span class="topbar-title">Agenda do Dia · Centro Médico AMAR</span>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="btn-download">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Baixar Card
      </button>
    </div>
  </header>

  <!-- ─── WORKSPACE ─── -->
  <div class="workspace">

    <!-- ─── PAINEL ESQUERDO ─── -->
    <aside class="panel">
      <div class="panel-inner">

        <!-- DATA + TURNO -->
        <div class="section">
          <div class="section-title">Data &amp; Turno</div>
          <div style="display:flex;gap:10px;align-items:flex-end;">
            <div class="field" style="flex:1;min-width:0;">
              <label class="label" for="inp-data">Data da agenda</label>
              <input type="date" class="input" id="inp-data">
            </div>
            <div style="flex-shrink:0;">
              <label class="label">Turno</label>
              <div class="turno-group" style="width:144px;">
                <button class="turno-btn ativo" data-turno="manha" type="button">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>
                  Manhã
                </button>
                <button class="turno-btn" data-turno="tarde" type="button">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
                  </svg>
                  Tarde
                </button>
                <button class="turno-btn" data-turno="noite" type="button">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                  Noite
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- PROFISSIONAIS -->
        <div class="section">
          <div class="section-title">Profissionais</div>
          <div id="lista-profissionais"></div>
          <button class="add-btn" id="btn-add-prof" type="button">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Adicionar Profissional
          </button>
        </div>

      </div>
    </aside>

    <!-- ─── PREVIEW DIREITA ─── -->
    <main class="preview-area">
      <div class="preview-scroll">
        <div class="card-outer">
          <div class="card-wrapper" id="card-wrapper"></div>
        </div>
      </div>
    </main>

  </div>
</div>

<!-- NOTIFICAÇÃO -->
<div id="notif" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
